<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #1A1F2B;
    --ink-raised: #141824;
    --chalk:      #EDEFF4;
    --haze:       #79839B;
    --safe-x: 4.5vw;
    --safe-y: 4vh;
    --gap: 1.6vw;

    /* How far an unfocused tile recedes. 1 is no change at all; the effect
       started at 0.5 brightness, which turned the light tiles grey. Kept as
       variables so the strength is one place to adjust. */
    --dim-brightness: 0.9;
    --dim-saturate: 0.92;
    --dim-opacity: 0.9;
    /* Stronger while a tile is being moved, since that is a modal state and
       wants to read differently from ordinary focus. */
    --arrange-brightness: 0.62;
    --arrange-saturate: 0.5;
    --arrange-opacity: 0.55;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--chalk);
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  body.pointer { cursor: default; }

  #shell {
    height: 100%;
    padding: var(--safe-y) var(--safe-x);
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 3vh;
  }

  /* ---- header ---- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  #stamp {
    display: flex;
    flex-direction: column;
    gap: 0.28em;
  }
  #clock {
    font-size: clamp(24px, 2.8vw, 54px);
    font-variation-settings: "wdth" 78, "wght" 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  #date {
    font-size: clamp(13px, 1.15vw, 22px);
    font-variation-settings: "wdth" 100, "wght" 400;
    color: var(--haze);
  }

  /* Leaving the launcher was a tile at the end of the grid, which put it in
     the way of the services. As a corner control it is out of the way but
     still reachable with arrows: Up from the top row lands here. */
  #power {
    border: 0;
    background: var(--ink-raised);
    color: var(--haze);
    width: clamp(44px, 3.6vw, 68px);
    height: clamp(44px, 3.6vw, 68px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 140ms ease, background 140ms ease,
                color 140ms ease, box-shadow 140ms ease;
  }
  #power svg {
    width: 52%;
    height: 52%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
  }
  #power.focused {
    background: #E8402F;
    color: #FFFFFF;
    transform: scale(1.12);
    box-shadow:
      0 0 46px -8px #E8402F,
      0 14px 30px -14px rgba(0, 0, 0, 0.9);
  }

  /* ---- grid ---- */
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    /* "safe" keeps the rows centred while they fit, but falls back to
       start-alignment once they overflow. Plain "center" pushes the first row
       off the top of the scroll container where it can never be reached. */
    align-content: safe center;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    /* A scroll container clips at its border box, which shears the glow off
       any tile near an edge. Sideways this is solved structurally rather than
       by guessing at the blur radius: the padding is exactly the safe-area
       margin and the negative margin cancels it, so the container runs the
       full width of the screen and its clip edge is the screen edge, where
       nothing can be seen. Tiles keep their positions either way.

       Vertically it cannot go full bleed without the glow washing over the
       clock and the footer, so the padding is a measured 64px. Chromium's
       blur reaches noticeably further than the nominal blur/2, and
       scale(1.07) magnifies the shadow along with the tile, so the earlier
       52px was not enough. */
    padding: 64px var(--safe-x);
    margin: -3vh calc(-1 * var(--safe-x));
    scroll-padding: 64px 0;
    scrollbar-width: none;
  }
  #grid::-webkit-scrollbar { display: none; }
  @media (max-width: 1100px) { #grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px)  { #grid { grid-template-columns: repeat(2, 1fr); } }

  .tile {
    position: relative;
    aspect-ratio: 16 / 10;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: var(--tint-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 1.1vw, 24px);
    font-family: inherit;
    text-align: center;
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  /* The tile's colour lives on a pseudo-element so the recede effect can be
     applied to the background alone. Filtering the tile itself would drain the
     logo with it, which turned every brand mark chalky. */
  .tile::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    /* --surface is the tile face, --tint stays the brand colour for the glow.
       They were one value, which meant a red Netflix wordmark sat on a red
       tile and vanished the moment it lit up. */
    background: var(--surface, var(--tint));
    filter: saturate(var(--dim-saturate)) brightness(var(--dim-brightness));
    transition: filter 140ms ease;
  }
  .tile > * {
    position: relative;
    z-index: 1;
  }
  .tile.focused::before { filter: none; }

  /* Content dims by fading rather than desaturating, so an unfocused logo is
     still recognisably its own colour. */
  .tile .label,
  .tile .logo {
    opacity: var(--dim-opacity);
    transition: opacity 140ms ease;
  }
  .tile.focused .label,
  .tile.focused .logo { opacity: 1; }
  .tile .label {
    font-size: clamp(20px, 2.6vw, 46px);
    font-variation-settings: "wdth" 108, "wght" 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    max-width: 92%;
  }

  /* A logo replaces the wordmark. Tiles without one show the service name
     centred at the same weight, so a text tile reads as its own treatment
     rather than as a logo that failed to arrive. */
  .tile .logo {
    max-width: 93%;
    max-height: 87%;
    object-fit: contain;
    /* Lifts flat marks off a saturated tile without touching photographic
       icons noticeably. */
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45));
    pointer-events: none;
  }
  /* Kept in the DOM for screen readers and for the fallback path. */
  .tile.has-logo .label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .tile.focused {
    transform: scale(1.07);
    z-index: 2;
    box-shadow:
      0 0 56px -12px var(--tint),
      0 20px 40px -16px rgba(0, 0, 0, 0.9);
  }

  /* A tile that has been picked up. Lifted further than a focused tile and
     tilted slightly, so it is obvious the next arrow press moves it rather
     than the cursor. */
  .tile.moving {
    z-index: 3;
    transform: scale(1.12) rotate(-1.4deg);
    box-shadow:
      0 0 80px -10px var(--tint),
      0 32px 64px -20px rgba(0, 0, 0, 0.95);
    cursor: grabbing;
  }
  .tile.moving::before { filter: none; }
  .tile.moving .label,
  .tile.moving .logo { opacity: 1; }
  .tile.moving .label::after {
    content: " \2194";
    opacity: 0.75;
  }

  /* Everything else recedes while a move is in progress, background first so
     the logos do not go grey. */
  #grid.arranging .tile:not(.moving)::before {
    filter: saturate(var(--arrange-saturate)) brightness(var(--arrange-brightness));
  }
  #grid.arranging .tile:not(.moving) .label,
  #grid.arranging .tile:not(.moving) .logo { opacity: var(--arrange-opacity); }

  @media (prefers-reduced-motion: reduce) {
    .tile.moving { transform: none; }
  }

  /* ---- footer ---- */
  footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 3vw;
    min-height: 5.5vh;
  }
  #note {
    font-size: clamp(13px, 1.05vw, 21px);
    font-variation-settings: "wdth" 100, "wght" 400;
    color: var(--haze);
    max-width: 62ch;
    line-height: 1.45;
  }
  #keys {
    display: flex;
    gap: 1.6vw;
    flex: none;
    font-size: clamp(11px, 0.85vw, 17px);
    color: var(--haze);
    font-variation-settings: "wdth" 92, "wght" 500;
  }
  #keys b {
    color: var(--chalk);
    font-variation-settings: "wdth" 92, "wght" 700;
    margin-right: 0.45em;
  }

  /* ---- screensaver ---- */
  #saver {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease;
  }
  #saver.on {
    opacity: 1;
    pointer-events: auto;
  }
  #saver .frame {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #saver .frame.show { opacity: 1; }
  /* Slow drift, so a static photo does not sit burning into an OLED panel and
     the screen has some life to it from across the room. */
  #saver.on .frame.show { animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift {
    from { transform: scale(1.06) translate(0, 0); }
    to   { transform: scale(1.14) translate(-1.5%, -1%); }
  }
  #saver .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0) 42%);
  }
  #saver .time {
    position: absolute;
    left: var(--safe-x);
    bottom: var(--safe-y);
    font-size: clamp(44px, 6vw, 120px);
    font-variation-settings: "wdth" 74, "wght" 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #FFFFFF;
    text-shadow: 0 4px 40px rgba(0, 0, 0, 0.7);
  }
  #saver .caption {
    position: absolute;
    right: var(--safe-x);
    bottom: var(--safe-y);
    max-width: 40ch;
    text-align: right;
    font-size: clamp(12px, 1vw, 20px);
    color: rgba(255, 255, 255, 0.62);
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
  }

  @media (prefers-reduced-motion: reduce) {
    #saver.on .frame.show { animation: none; }
  }

  #fault {
    font-size: clamp(13px, 1.05vw, 21px);
    color: #FF7A6B;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile.focused { transform: none; }
  }
</style>
</head>
<body>
<div id="shell">
  <header>
    <div id="stamp">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <button id="power" type="button" aria-label="Exit to the Raspberry Pi desktop">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.5 v8" />
        <path d="M6.3 6.6 a7.5 7.5 0 1 0 11.4 0" />
      </svg>
    </button>
  </header>

  <div id="grid" role="listbox" aria-label="Services"></div>

  <footer>
    <div id="note"></div>
    <div id="keys">
      <span><b>Arrows</b>move</span>
      <span><b>OK</b>open</span>
      <span><b>Back</b>close</span>
      <span><b>Hold OK</b>rearrange</span>
    </div>
  </footer>
</div>

<div id="saver" aria-hidden="true">
  <div class="frame" id="frameA"></div>
  <div class="frame" id="frameB"></div>
  <div class="veil"></div>
  <div class="time" id="saverTime"></div>
  <div class="caption" id="saverCaption"></div>
</div>

<script>
(function () {
  "use strict";

  const grid = document.getElementById("grid");
  const note = document.getElementById("note");
  const clockEl = document.getElementById("clock");
  const dateEl = document.getElementById("date");

  let services = [];
  let tiles = [];
  let cursor = 0;

  // Reordering state. `moving` is the index of the picked-up tile, or -1.
  let moving = -1;
  let orderBeforeMove = null;
  let holdTimer = null;
  let holdFired = false;
  let dragFrom = null;

  // cursor === POWER means the corner power control has focus rather than any
  // tile, which is how it stays reachable without a pointer.
  const POWER = -1;
  const power = document.getElementById("power");

  /* ---------- clock ---------- */
  function tick() {
    const now = new Date();
    // en-US rather than the system locale, which is en_GB on Raspberry Pi OS
    // and renders the suffix lowercase as "pm". "numeric" drops the leading
    // zero, so it reads 9:04 PM rather than 09:04 PM.
    clockEl.textContent = now.toLocaleTimeString("en-US", {
      hour: "numeric", minute: "2-digit", hour12: true
    });
    dateEl.textContent = now.toLocaleDateString([], {
      weekday: "long", day: "numeric", month: "long"
    });
  }
  tick();
  setInterval(tick, 15000);

  /* ---------- rendering ---------- */
  function columns() {
    return getComputedStyle(grid).gridTemplateColumns.split(" ").length;
  }

  function paint() {
    power.classList.toggle("focused", cursor === POWER);
    tiles.forEach((t, i) => {
      const on = i === cursor;
      t.classList.toggle("focused", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
    });
    tiles.forEach((t, i) => t.classList.toggle("moving", i === moving));

    const svc = services[cursor];
    // The per-service note stays in services.json as catalog documentation but
    // is not shown; on a TV it was reading as clutter. The footer is still used
    // for the move-mode hint and for errors.
    note.textContent = moving >= 0 && svc
      ? "Moving " + svc.name + ". Arrows place it, Enter keeps it, Escape puts it back."
      : "";

    // Keyboard focus has to drag the viewport with it, otherwise rows past the
    // fold are selectable but never visible. "nearest" scrolls the minimum
    // amount, so tiles already on screen do not jump around.
    const active = tiles[cursor];
    if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  /* ---------- reordering ---------- */

  // FLIP: measure, mutate, then animate each tile from where it used to be.
  // The picked-up tile is skipped because its own transform is doing the work.
  function flip(mutate) {
    const before = new Map(tiles.map(t => [t, t.getBoundingClientRect()]));
    mutate();
    tiles.forEach(t => {
      if (t.classList.contains("moving")) return;
      const b = before.get(t);
      if (!b) return;
      const a = t.getBoundingClientRect();
      const dx = b.left - a.left;
      const dy = b.top - a.top;
      if (!dx && !dy) return;
      t.animate(
        [{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
        { duration: 190, easing: "cubic-bezier(0.2, 0, 0, 1)" }
      );
    });
  }

  function movableCount() {
    return services.length;
  }

  function syncDom() {
    tiles.forEach(t => grid.appendChild(t));
  }

  function reorder(from, to) {
    if (to < 0 || to >= movableCount() || from === to) return false;
    flip(() => {
      services.splice(to, 0, services.splice(from, 1)[0]);
      tiles.splice(to, 0, tiles.splice(from, 1)[0]);
      syncDom();
    });
    moving = to;
    cursor = to;
    paint();
    return true;
  }

  function pickUp(i) {
    if (i < 0 || i >= movableCount()) return;   // never the power control
    moving = i;
    cursor = i;
    orderBeforeMove = services.slice();
    grid.classList.add("arranging");
    paint();
  }

  function drop(save) {
    if (moving < 0) return;
    const wasMoving = moving;
    moving = -1;
    grid.classList.remove("arranging");
    if (!save && orderBeforeMove) {
      flip(() => {
        const byId = new Map(services.map((s, i) => [s.id, tiles[i]]));
        services = orderBeforeMove.slice();
        tiles = services.map(s => byId.get(s.id));
        syncDom();
      });
      cursor = services.findIndex(s => s === orderBeforeMove[wasMoving]);
    } else {
      post("/order", { ids: services.slice(0, movableCount()).map(s => s.id) })
        .then(res => {
          if (res.error) note.innerHTML = '<span id="fault">' + res.error + "</span>";
        })
        .catch(() => {
          note.innerHTML = '<span id="fault">Could not save the new order.</span>';
        });
    }
    orderBeforeMove = null;
    paint();
  }

  function move(delta) {
    if (!tiles.length) return;
    const cols = columns();
    if (cursor === POWER) {
      // Only downward leaves the power control, back into the top row.
      if (delta > 0) { cursor = Math.min(cols - 1, tiles.length - 1); paint(); }
      return;
    }
    const next = cursor + delta;
    // Up from the top row reaches the power control instead of stopping dead.
    if (next < 0) {
      if (delta === -cols) { cursor = POWER; paint(); }
      return;
    }
    if (next >= tiles.length) return;
    cursor = next;
    paint();
  }

  function build(list) {
    services = list;
    grid.textContent = "";
    tiles = services.map((svc, i) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.style.setProperty("--tint", svc.color || "#2A3040");
      btn.style.setProperty("--tint-ink", svc.ink || "#FFFFFF");
      if (svc.tile_bg) btn.style.setProperty("--surface", svc.tile_bg);
      btn.setAttribute("role", "option");

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = svc.name;
      btn.appendChild(label);

      if (svc.logo) {
        const img = document.createElement("img");
        img.className = "logo";
        img.alt = "";
        img.decoding = "async";
        // Only commit to the logo treatment once the image really loaded, so a
        // missing or corrupt file leaves a normal text tile rather than a gap.
        img.addEventListener("load", () => btn.classList.add("has-logo"));
        img.addEventListener("error", () => img.remove());
        img.src = svc.logo;
        btn.appendChild(img);
      }

      btn.addEventListener("click", () => {
        // Suppressed after a drag so dropping a tile does not also launch it.
        if (btn.dataset.dragged === "1") { delete btn.dataset.dragged; return; }
        cursor = tiles.indexOf(btn);
        paint();
        open();
      });
      btn.addEventListener("mouseenter", () => {
        const at = tiles.indexOf(btn);
        if (moving >= 0) { reorder(moving, at); return; }
        cursor = at;
        paint();
      });
      btn.addEventListener("mousedown", e => {
        if (e.button !== 0) return;
        const at = tiles.indexOf(btn);
        if (at >= movableCount()) return;
        dragFrom = { x: e.clientX, y: e.clientY, index: at };
      });
      grid.appendChild(btn);
      return btn;
    });
    paint();
  }

  /* ---------- actions ---------- */
  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(r => r.json());
  }

  let busy = false;

  function toDesktop() {
    if (busy) return;
    busy = true;
    post("/desktop")
      .then(res => {
        if (res.error) note.innerHTML = '<span id="fault">' + res.error + "</span>";
      })
      .catch(() => {
        // Expected on success: the window this page runs in is being closed.
      })
      .finally(() => { setTimeout(() => { busy = false; }, 800); });
  }

  function open() {
    if (cursor === POWER) { toDesktop(); return; }
    const svc = services[cursor];
    if (!svc || busy) return;
    busy = true;
    post("/launch", { id: svc.id })
      .then(res => {
        if (res.error) note.innerHTML = '<span id="fault">' + res.error + "</span>";
      })
      .catch(() => {
        note.innerHTML = '<span id="fault">Launcher service is not responding.</span>';
      })
      .finally(() => { setTimeout(() => { busy = false; }, 800); });
  }

  function close() { post("/close").catch(() => {}); }

  /* ---------- input ---------- */
  document.addEventListener("keydown", e => {
    const cols = columns();

    if (e.key === "Enter" || e.key === " ") {
      if (e.repeat) { e.preventDefault(); return; }
      if (moving >= 0) { drop(true); e.preventDefault(); return; }
      // Hold to pick a tile up; a short press still just opens it.
      holdFired = false;
      if (holdTimer === null && cursor >= 0 && cursor < movableCount()) {
        holdTimer = setTimeout(() => {
          holdTimer = null;
          holdFired = true;
          pickUp(cursor);
        }, 550);
      }
      e.preventDefault();
      return;
    }

    switch (e.key) {
      case "ArrowLeft":  moving >= 0 ? reorder(moving, moving - 1) : move(-1); break;
      case "ArrowRight": moving >= 0 ? reorder(moving, moving + 1) : move(1); break;
      case "ArrowUp":    moving >= 0 ? reorder(moving, moving - cols) : move(-cols); break;
      case "ArrowDown":  moving >= 0 ? reorder(moving, moving + cols) : move(cols); break;
      case "Escape":
      case "Backspace":
      case "Home":
        if (moving >= 0) drop(false); else close();
        break;
      default: return;
    }
    e.preventDefault();
  });

  document.addEventListener("keyup", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (holdTimer !== null) {
      clearTimeout(holdTimer);
      holdTimer = null;
      if (!holdFired && moving < 0) open();
    }
    e.preventDefault();
  });

  power.addEventListener("click", () => { cursor = POWER; paint(); toDesktop(); });
  power.addEventListener("mouseenter", () => { if (moving < 0) { cursor = POWER; paint(); } });

  // Mouse dragging shares the same move mode the keyboard uses, so both end
  // up in reorder() and animate identically.
  document.addEventListener("mousemove", e => {
    if (!dragFrom || moving >= 0) return;
    const dx = e.clientX - dragFrom.x;
    const dy = e.clientY - dragFrom.y;
    if (dx * dx + dy * dy < 64) return;   // 8px threshold, ignores a shaky click
    pickUp(dragFrom.index);
    tiles[moving].dataset.dragged = "1";
  });
  document.addEventListener("mouseup", () => {
    dragFrom = null;
    if (moving >= 0) drop(true);
  });

  /* ---------- screensaver ---------- */

  const IDLE_MS = 10 * 60 * 1000;   // idle time on the tile screen before it starts
  const SLIDE_MS = 45 * 1000;       // how long each picture holds
  const BUSY_MS = 30 * 1000;        // recheck interval while a service is open

  const saver = document.getElementById("saver");
  const frames = [document.getElementById("frameA"), document.getElementById("frameB")];
  const saverTime = document.getElementById("saverTime");
  const saverCaption = document.getElementById("saverCaption");

  let idleTimer = null;
  let slideTimer = null;
  let shots = [];
  let shot = 0;
  let frameOn = 0;
  let saverOn = false;

  function paintTime() {
    saverTime.textContent = new Date().toLocaleTimeString("en-US", {
      hour: "numeric", minute: "2-digit", hour12: true
    });
  }

  function nextShot() {
    if (!shots.length) return;
    const url = shots[shot % shots.length];
    shot += 1;
    const incoming = frames[frameOn ^ 1];
    const outgoing = frames[frameOn];
    // Decode first so the crossfade never reveals a half-painted image.
    const pre = new Image();
    pre.onload = () => {
      incoming.style.backgroundImage = 'url("' + url + '")';
      incoming.classList.add("show");
      outgoing.classList.remove("show");
      frameOn ^= 1;
      paintTime();
    };
    pre.onerror = () => {
      // A dead link just moves the queue along rather than stalling it.
      shots = shots.filter(u => u !== url);
      if (shots.length) nextShot();
    };
    pre.src = url;
  }

  function startSaver() {
    if (saverOn || moving >= 0) return;
    fetch("/wallpapers")
      .then(r => r.json())
      .then(data => {
        shots = (data && data.urls) || [];
        if (!shots.length) return;      // nothing to show, stay on the tiles
        saverOn = true;
        saver.classList.add("on");
        saver.setAttribute("aria-hidden", "false");
        saverCaption.textContent = data.source === "local"
          ? "" : "Imagery from " + data.source;
        paintTime();
        nextShot();
        slideTimer = setInterval(nextShot, SLIDE_MS);
      })
      .catch(() => {});
  }

  function stopSaver() {
    if (!saverOn) return;
    saverOn = false;
    saver.classList.remove("on");
    saver.setAttribute("aria-hidden", "true");
    clearInterval(slideTimer);
    slideTimer = null;
    frames.forEach(f => f.classList.remove("show"));
  }

  // Whether a service was open at the last check, so returning to the tiles
  // restarts the countdown instead of tripping it immediately.
  let wasRunning = false;

  function armIdle(ms) {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(checkIdle, ms);
  }

  function checkIdle() {
    // The launcher page keeps running underneath an open service and receives
    // no input there, so elapsed time alone would trip the screensaver behind
    // whatever is playing. The daemon knows whether a window is open.
    fetch("/status")
      .then(r => r.json())
      .then(s => {
        if (s.running) {
          wasRunning = true;
          armIdle(BUSY_MS);          // still watching something, keep waiting
        } else if (wasRunning) {
          wasRunning = false;
          armIdle(IDLE_MS);          // just came back to the tiles, start over
        } else {
          startSaver();
        }
      })
      .catch(() => armIdle(BUSY_MS));
  }

  function poke() {
    wasRunning = false;
    armIdle(IDLE_MS);
  }

  // Any input dismisses it. The event that woke the screen is swallowed, so
  // the keypress that ends the screensaver does not also open a service.
  ["keydown", "mousemove", "mousedown", "wheel"].forEach(evt => {
    document.addEventListener(evt, e => {
      if (saverOn) {
        stopSaver();
        e.preventDefault();
        e.stopImmediatePropagation();
      }
      poke();
    }, true);
  });
  setInterval(() => { if (saverOn) paintTime(); }, 15000);
  poke();

  // Reveal the cursor only once a pointing device is actually used, so an
  // air mouse works without leaving a stray arrow on screen the rest of the time.
  window.addEventListener("mousemove", () => document.body.classList.add("pointer"), { once: true });

  /* ---------- boot ---------- */
  fetch("/services.json")
    .then(r => r.json())
    .then(build)
    .catch(() => {
      note.innerHTML = '<span id="fault">Could not read services.json. Check the launcher service.</span>';
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #1A1F2B;
    --ink-raised: #141824;
    --chalk:      #EDEFF4;
    --haze:       #79839B;
    --live:       #4C8DFF;
    --warn:       #E8402F;
    --safe-x: 4.5vw;
    --safe-y: 4vh;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--ink);
    color: var(--chalk);
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(14px, 1.15vw, 21px);
    /* The page still scrolls, the bar just is not drawn. A scrollbar on a
       television reads as something broken, and there is nothing to drag it
       with anyway: moving focus scrolls the page to follow. */
    scrollbar-width: none;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

  #page {
    max-width: 1100px;
    margin: 0 auto;
    padding: var(--safe-y) var(--safe-x) 12vh;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1em;
    margin-bottom: 1.6em;
  }
  h1 {
    font-size: clamp(24px, 2.6vw, 46px);
    font-variation-settings: "wdth" 78, "wght" 500;
    letter-spacing: -0.02em;
  }
  h2 {
    font-size: 1.15em;
    font-variation-settings: "wght" 500;
    color: var(--haze);
    margin: 2em 0 0.7em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  p.hint {
    color: var(--haze);
    margin: -0.3em 0 1em;
    line-height: 1.5;
  }

  button, select, input {
    font: inherit;
    color: inherit;
    border-radius: 12px;
    border: 2px solid transparent;
    background: var(--ink-raised);
    padding: 0.62em 0.9em;
  }
  button { cursor: pointer; }

  /* One focus treatment for everything. The d-pad on the remote is the main
     way around this page, so whatever holds focus has to be obvious from
     across a room. */
  [data-nav]:focus {
    outline: none;
    border-color: var(--live);
    box-shadow: 0 0 0 4px rgba(76, 141, 255, 0.22);
  }
  /* A blue ring around a blue button is no ring at all. Anything already
     wearing the accent color gets its focus drawn in the text color, which
     is the one thing guaranteed to contrast with it. */
  .primary:focus {
    border-color: var(--chalk);
    box-shadow: 0 0 0 4px rgba(237, 239, 244, 0.3);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 0.9em;
    background: var(--ink-raised);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 0.7em 0.9em;
    margin-bottom: 0.6em;
    width: 100%;
    text-align: left;
  }
  .row .swatch {
    width: 2.4em;
    height: 2.4em;
    border-radius: 9px;
    display: grid;
    place-items: center;
    flex: none;
    overflow: hidden;
    font-variation-settings: "wght" 700;
  }
  .row .swatch img { width: 76%; height: 76%; object-fit: contain; }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { font-variation-settings: "wght" 500; }
  .row .who small { display: block; color: var(--haze); }
  .tag {
    font-size: 0.78em;
    color: var(--haze);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 0.1em 0.6em;
    flex: none;
  }

  /* Filling this row with the accent color left its subtitle as grey on
     blue and cost it a visible focus ring. It reads better as an ordinary
     row that happens to be marked in the accent: the plus and the title
     carry it, and the contrast is the same as every other row here. */
  .row.add .who b { color: var(--live); }

  .actions { display: flex; gap: 0.5em; flex-wrap: wrap; margin-top: 1em; }
  .primary { background: var(--live); color: #06122B; font-variation-settings: "wght" 500; }
  .danger  { background: transparent; border-color: var(--warn); color: var(--warn); }

  .field { margin-bottom: 0.9em; }
  .field label { display: block; color: var(--haze); margin-bottom: 0.3em; }
  .field input, .field select { width: 100%; }

  /* Four across because that is what fits a 4x4 board of colors without the
     swatches turning into targets you have to aim at from the sofa. */
  .swatches {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.6em;
    /* An explicit width, not a maximum. The swatches size themselves from the
       column and have no width of their own, so with the tabs moved out of
       this column there was nothing left to give it one and the whole board
       collapsed to a few dots. */
    width: 12em;
  }
  .swatches button {
    aspect-ratio: 1;
    border-radius: 12px;
    padding: 0;
    position: relative;
    /* A hairline, because the dark board is sixteen near-blacks on a dark
       page and without an edge they read as one smudge. Drawn as an outline
       rather than a border so it does not fight the focus treatment, which
       owns the border and the box-shadow. */
    outline: 1px solid rgba(237, 239, 244, 0.14);
    outline-offset: -1px;
  }
  /* A dot rather than a ring, because the ring slot is taken by the focus
     treatment and the two would fight on the swatch that is both. */
  .swatches button[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.55);
  }
  .faces { display: flex; gap: 0.5em; flex-wrap: wrap; }
  .faces button[aria-pressed="true"],
  .toggle[aria-pressed="true"] {
    background: var(--live);
    color: #06122B;
    font-variation-settings: "wght" 500;
  }
  /* Board on the left, preview filling the space beside it. Halving the
     swatches left that space empty, and a preview is the one thing here that
     benefits from being large. */
  .color-row {
    display: flex;
    align-items: stretch;
    gap: 1.2em;
    flex-wrap: wrap;
  }
  .color-board { flex: none; }
  .color-side {
    flex: 1 1 16em;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
  }
  /* A copy of the tile as the launcher draws it: same 16/10, same corner, the
     face on a pseudo-element so the unfocused version can be dimmed without
     draining the logo with it. Kept in step with index.html by hand, which is
     the cost of previewing one page inside another. */
  .tile-previews {
    display: flex;
    gap: 0.9em;
    align-items: flex-start;
  }
  .tile-previews figure { flex: 1 1 0; min-width: 0; }
  .tile-previews figcaption {
    color: var(--haze);
    font-size: 0.85em;
    text-align: center;
    margin-top: 0.35em;
  }
  .tile-preview {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    /* Flex, not grid. The logo below is capped as a percentage of this box,
       and Chromium resolves that against a flex line but not a grid area. */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.7em;
    overflow: hidden;
    text-align: center;
  }
  .tile-preview::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    background: var(--face, #06122B);
  }
  /* The same recede the launcher applies to a tile that is not selected. */
  .tile-preview.dimmed::before { filter: saturate(0.92) brightness(0.9); }
  .tile-preview.dimmed img,
  .tile-preview.dimmed .pv-label { opacity: 0.9; }
  .tile-preview > * { position: relative; z-index: 1; }
  .tile-preview img {
    max-width: 93%;
    max-height: 87%;
    object-fit: contain;
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45));
    cursor: crosshair;
  }
  .tile-preview img.flat { filter: none; }
  .pv-label {
    font-variation-settings: "wdth" 108, "wght" 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    font-size: 1.5em;
    max-width: 92%;
  }
  .picker-hint {
    color: var(--haze);
    font-size: 0.85em;
  }

  /* Pinned to the bottom of the screen rather than the bottom of the page.
     It used to sit below the fold, so "that site published no usable icon"
     was written somewhere nobody could see and the button that said it looked
     like it had simply done nothing. */
  #note {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding: 0.85em var(--safe-x);
    background: var(--ink-raised);
    border-top: 2px solid var(--live);
    color: var(--chalk);
    line-height: 1.5;
  }
  #note:empty { display: none; }
  #note.bad { border-top-color: var(--warn); color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="page">
  <header>
    <h1 id="title">Settings</h1>
    <button id="done" type="button" data-nav>Done</button>
  </header>

  <!-- ---------- list view ---------- -->
  <section id="list-view">
    <button class="row add" id="add" type="button" data-nav>
      <span class="swatch" style="background:#06122B;color:#4C8DFF">+</span>
      <span class="who"><b>Add a service</b><small>A web page, or an app already installed in Android</small></span>
    </button>

    <h2>Tiles</h2>
    <div id="tiles"></div>

    <h2>Installed Android apps</h2>
    <p class="hint" id="android-hint">Looking for installed apps...</p>
    <div id="android"></div>

    <h2>This machine</h2>
    <button class="row" id="desktop" type="button" data-nav>
      <span class="swatch" style="background:#2A1714;color:#E8402F">&#9211;</span>
      <span class="who"><b>Exit to the Pi desktop</b><small>The same thing the Menu button on the remote does</small></span>
    </button>
  </section>

  <!-- ---------- form view ---------- -->
  <section id="form-view" hidden>
    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" data-nav autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="f-kind">Type</label>
      <select id="f-kind" data-nav>
        <option value="">Web page</option>
        <option value="android">Android app</option>
      </select>
    </div>

    <div class="field" id="url-field">
      <label for="f-url">Address</label>
      <input id="f-url" data-nav autocomplete="off" spellcheck="false" placeholder="https://">
    </div>

    <div class="field" id="package-field" hidden>
      <label for="f-package">Android app</label>
      <select id="f-package" data-nav></select>
    </div>

    <div class="field">
      <label>Tile color</label>
      <div class="faces" id="faces">
        <button type="button" data-nav data-row="faces" data-face="bright">Bright</button>
        <button type="button" data-nav data-row="faces" data-face="dark">Dark</button>
        <button type="button" data-nav data-row="faces" data-face="light">Light</button>
        <button type="button" data-nav data-row="faces" data-face="logo" hidden>From logo</button>
      </div>
      <div class="color-row">
        <div class="color-board">
          <div class="swatches" id="palette"></div>
        </div>
        <div class="color-side">
          <div class="tile-previews">
            <figure>
              <div class="tile-preview" id="preview-on"></div>
              <figcaption>Focused</figcaption>
            </figure>
            <figure>
              <div class="tile-preview dimmed" id="preview-off"></div>
              <figcaption>Not focused</figcaption>
            </figure>
          </div>
          <p class="picker-hint" id="picker-hint" hidden></p>
        </div>
      </div>
    </div>


    <div class="field">
      <label for="f-note">Note (only ever shown here)</label>
      <input id="f-note" data-nav autocomplete="off">
    </div>

    <button class="row" id="hidden-toggle" type="button" data-nav>
      <span class="swatch" id="hidden-mark" style="background:#06122B;color:#79839B">&#10003;</span>
      <span class="who"><b id="hidden-label">Shown on the launcher</b><small>Hidden tiles stay in the catalog and keep their settings</small></span>
    </button>

    <div class="actions">
      <button id="eyedropper" type="button" data-nav hidden>Pick a color off the screen</button>
      <button id="fetch" type="button" data-nav>Fetch logo and colors</button>
      <button id="upload" type="button" data-nav>Upload a logo</button>
      <button id="drop-logo" type="button" data-nav>Remove logo</button>
      <button class="toggle" id="shadow-toggle" type="button" data-nav hidden>Logo shadow: on</button>
    </div>

    <div class="actions">
      <button class="primary" id="save" type="button" data-nav>Save</button>
      <button id="cancel" type="button" data-nav>Cancel</button>
      <button class="danger" id="remove" type="button" data-nav>Delete this tile</button>
    </div>

    <input id="file" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
  </section>

  <div id="note"></div>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const note = $("note");
  let catalog = [];
  let apps = [];
  let editing = null;      // the service being edited, or null when adding
  let logoUrl = null;      // logo for the service in the form, if it has one
  let isHidden = false;
  let chosenColor = "";    // the tile color itself, exactly as it will appear
  let tab = "dark";        // which board is showing: dark faces or light ones
  let logoShadow = true;   // whether the tile lifts its logo with a shadow
  let glow = "";           // the brand color the launcher glows when focused
  let logoColors = [];     // colors read out of the logo now in the preview
  let sampledFrom = null;  // the logo those came from, so it is read once
  let logoStamp = 0;       // cache-buster, changed when the logo changes

  // Two boards rather than one. An earlier version had you pick a bright
  // brand color and then quietly derived a near-black face from it, so the
  // swatch you clicked was never the color you got. Here the swatch is the
  // face: the tabs only decide which end of the range is on offer.
  const FACES = {
    // The original board. A tile face does not have to be a near-black or a
    // near-white, and a service whose whole identity is one loud color wants
    // that color on the tile.
    bright: [
      "#E50914", "#FF5722", "#FF9800", "#FFC107",
      "#1CE783", "#01875F", "#00BCD4", "#00A8E1",
      "#0064FF", "#113CCF", "#4C8DFF", "#7C4DFF",
      "#C724B1", "#E91E63", "#EDEFF4", "#79839B",
    ],
    dark: [
      "#121212", "#1A1F2B", "#0F171E", "#000000",
      "#1C0A0A", "#2A1714", "#1E1207", "#0A1A0A",
      "#07160F", "#071A1A", "#0A1633", "#12071E",
      "#1A0714", "#242A38", "#2B2B2B", "#141824",
    ],
    light: [
      "#FFFFFF", "#F5F7FA", "#EDEFF4", "#DDE3EC",
      "#FDECEC", "#FFF1E6", "#FFF9E0", "#F7FAE6",
      "#E9F7E9", "#E6F7F7", "#E8F1FF", "#F3EAFF",
      "#FFEAF4", "#FAF0E1", "#F0F0F0", "#C9D2E0",
    ],
  };
  const PALETTE_COLUMNS = 4;

  function say(text, bad) {
    note.textContent = text || "";
    note.classList.toggle("bad", Boolean(bad));
  }

  async function api(path, body) {
    const opts = body
      ? { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body) }
      : {};
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  /* ---------- navigation ----------
     The remote sends plain arrow keys and this is a form, so focus is moved
     by hand. Chromium only does that by itself with spatial navigation on,
     which the launcher shell deliberately does not enable. Left and right are
     left alone so they still move the caret inside a text box. */
  function focusables() {
    return [...document.querySelectorAll("[data-nav]")]
      .filter(el => el.offsetParent !== null && !el.disabled);
  }

  function land(el) {
    if (!el) return false;
    el.focus();
    el.scrollIntoView({ block: "nearest" });
    return true;
  }

  // Anything laid out as a block of buttons rather than a stack of fields:
  // the color board at four across, the pair of tabs above it. Movement
  // inside is by position, and running off the top or bottom hands over to
  // the field either side rather than stopping dead.
  function moveInGroup(key, selector, columns) {
    const group = [...document.querySelectorAll(selector)]
      .filter(el => el.offsetParent !== null);
    const at = group.indexOf(document.activeElement);
    if (at < 0) return false;
    // A column count of zero means one row however wide it happens to be, so
    // up and down always leave it. The tab row grows and shrinks.
    const across = columns || group.length;
    let to = -1;
    if (key === "ArrowLeft") to = at - 1;
    else if (key === "ArrowRight") to = at + 1;
    else if (key === "ArrowUp") to = at - across;
    else if (key === "ArrowDown") to = at + across;
    else return false;
    if (to >= 0 && to < group.length) return land(group[to]);
    if (key !== "ArrowUp" && key !== "ArrowDown") return false;
    const items = focusables();
    return land(key === "ArrowUp"
      ? items[items.indexOf(group[0]) - 1]
      : items[items.indexOf(group[group.length - 1]) + 1]);
  }

  document.addEventListener("keydown", e => {
    const active = document.activeElement;
    const row = active && active.dataset ? active.dataset : {};
    // The tabs are a row two wide and one tall, so a column count of two
    // means left and right walk them while up and down always leave.
    if (row.row === "faces") {
      if (moveInGroup(e.key, "[data-row=faces]", 0)) { e.preventDefault(); return; }
    }
    // The color board is a grid, so it gets grid movement. The flat list
    // below would walk it one swatch at a time, which is sixteen presses to
    // cross four rows.
    if (row.grid === "palette") {
      if (moveInGroup(e.key, "[data-grid=palette]", PALETTE_COLUMNS)) {
        e.preventDefault();
        return;
      }
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const items = focusables();
      if (!items.length) return;
      const at = items.indexOf(document.activeElement);
      const step = e.key === "ArrowDown" ? 1 : -1;
      // Wraps on purpose: the end of a long tile list is quicker to reach
      // upwards from the top than by holding an arrow down.
      const next = at < 0 ? 0 : (at + step + items.length) % items.length;
      items[next].focus();
      items[next].scrollIntoView({ block: "nearest" });
      e.preventDefault();
    } else if (e.key === "BrowserBack" || e.key === "Escape") {
      if ($("form-view").hidden) leave();
      else showList();
      e.preventDefault();
    }
  });

  /* ---------- list ---------- */
  function tile(svc) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    row.setAttribute("data-nav", "");
    row.innerHTML =
      '<span class="swatch"></span>' +
      '<span class="who"><b></b><small></small></span>' +
      (svc.kind === "android" ? '<span class="tag">Android</span>' : "") +
      (svc.hidden ? '<span class="tag">Hidden</span>' : "");
    const swatch = row.querySelector(".swatch");
    swatch.style.background = svc.tile_bg || "#06122B";
    swatch.style.color = svc.color || "#EDEFF4";
    if (svc.logo) {
      const img = document.createElement("img");
      img.src = svc.logo;
      img.alt = "";
      swatch.appendChild(img);
    } else {
      swatch.textContent = (svc.name || "?").slice(0, 1).toUpperCase();
    }
    // Names and addresses come from the catalog, which is edited here and by
    // hand, so they go in as text rather than as markup.
    row.querySelector("b").textContent = svc.name;
    row.querySelector("small").textContent =
      (svc.kind === "android" ? svc.package : svc.url) || "";
    row.addEventListener("click", () => showForm(svc));
    return row;
  }

  function renderList() {
    const box = $("tiles");
    box.textContent = "";
    catalog.forEach(svc => box.appendChild(tile(svc)));
  }

  function renderAndroid() {
    const box = $("android");
    const hint = $("android-hint");
    box.textContent = "";
    if (!apps.length) {
      hint.textContent = "No Android apps found. Waydroid may not be running.";
      return;
    }
    const known = new Set(catalog.filter(s => s.package).map(s => s.package));
    const fresh = apps.filter(a => !known.has(a.package));
    if (!fresh.length) {
      hint.textContent = "Every installed app already has a tile.";
      return;
    }
    hint.textContent = "Installed in Android but not on the launcher. " +
      "Anything added from the Play Store turns up here.";
    fresh.forEach(app => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "row";
      row.setAttribute("data-nav", "");
      row.innerHTML =
        '<span class="swatch" style="background:#06122B;color:#4C8DFF">+</span>' +
        '<span class="who"><b></b><small></small></span>';
      row.querySelector("b").textContent = app.name;
      row.querySelector("small").textContent = app.package;
      row.addEventListener("click", () => {
        showForm({ name: app.name, kind: "android", package: app.package });
      });
      box.appendChild(row);
    });
  }

  function showList() {
    $("form-view").hidden = true;
    $("list-view").hidden = false;
    $("title").textContent = "Settings";
    renderList();
    renderAndroid();
    $("add").focus();
  }

  /* ---------- form ---------- */
  function slug(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+/, "").replace(/-+$/, "").slice(0, 32);
  }

  function luminance(hex) {
    const n = parseInt(hex.slice(1), 16);
    return (0.2126 * ((n >> 16) & 255)
          + 0.7152 * ((n >> 8) & 255)
          + 0.0722 * (n & 255)) / 255;
  }

  // What the tile will actually look like. The swatch is the face, so there
  // is nothing to derive here.
  function faceColor() {
    return chosenColor || "#06122B";
  }

  function tabFor(color) {
    if (!color) return "dark";
    const n = parseInt(color.slice(1), 16);
    const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    if (Math.max(r, g, b) - Math.min(r, g, b) >= 40) return "bright";
    return luminance(color) > 0.6 ? "light" : "dark";
  }

  // Readable text on the tile is arithmetic, not a decision worth handing to
  // whoever is adding a service.
  function inkColor() {
    return luminance(faceColor()) > 0.6 ? "#101014" : "#FFFFFF";
  }

  function fromHsl(h, s, l) {
    const channel = n => {
      const k = (n + h * 12) % 12;
      const a = s * Math.min(l, 1 - l);
      return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
    };
    return hex(channel(0), channel(8), channel(4));
  }

  // The launcher glows a tile in its brand color when focused, and a face
  // that is nearly black would glow nearly not at all. The glow is that same
  // hue turned up, rather than a second thing to pick.
  function glowColor() {
    const n = parseInt(faceColor().slice(1), 16);
    const r = ((n >> 16) & 255) / 255;
    const g = ((n >> 8) & 255) / 255;
    const b = (n & 255) / 255;
    const hi = Math.max(r, g, b), lo = Math.min(r, g, b);
    if (hi === lo) return "#D8DEE9";   // a grey face has no hue to turn up
    const d = hi - lo;
    const l = (hi + lo) / 2;
    const s = l > 0.5 ? d / (2 - hi - lo) : d / (hi + lo);
    let h;
    if (hi === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (hi === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
    return fromHsl(h, Math.max(s, 0.7), 0.55);
  }

  function hex(r, g, b) {
    return "#" + [r, g, b]
      .map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
  }

  // Colors taken out of the logo itself, which are the ones most likely to be
  // wanted and are never in a fixed board of sixteen.
  function sampleLogo(img) {
    const canvas = document.createElement("canvas");
    const scale = Math.min(1, 96 / Math.max(img.naturalWidth, img.naturalHeight));
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    let data;
    try {
      data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    } catch (err) {
      // Only reachable if a logo ever came from another origin, which would
      // taint the canvas. Losing the extra swatches is the whole cost.
      return [];
    }
    const counts = new Map();
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] < 128) continue;
      // Bucketed, or a photograph returns several hundred near-identical
      // shades and the row becomes a gradient rather than a set of choices.
      const key = (data[i] >> 5) * 64 + (data[i + 1] >> 5) * 8 + (data[i + 2] >> 5);
      const seen = counts.get(key);
      if (seen) { seen.n += 1; seen.r += data[i]; seen.g += data[i + 1]; seen.b += data[i + 2]; }
      else counts.set(key, { n: 1, r: data[i], g: data[i + 1], b: data[i + 2] });
    }
    return [...counts.values()]
      .sort((a, b) => b.n - a.n)
      .slice(0, 8)
      .map(c => hex(Math.round(c.r / c.n), Math.round(c.g / c.n), Math.round(c.b / c.n)));
  }

  function pixelAt(img, event) {
    const box = img.getBoundingClientRect();
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const x = Math.floor((event.clientX - box.left) / box.width * img.naturalWidth);
    const y = Math.floor((event.clientY - box.top) / box.height * img.naturalHeight);
    try {
      const px = ctx.getImageData(x, y, 1, 1).data;
      // A transparent pixel is the space around a mark, not a choice.
      return px[3] < 8 ? null : hex(px[0], px[1], px[2]);
    } catch (err) {
      return null;
    }
  }

  function choose(color) {
    chosenColor = color;
    renderPalette();
    paint();
  }

  function renderPalette() {
    const box = $("palette");
    box.textContent = "";
    const colors = tab === "logo" ? logoColors.slice() : FACES[tab].slice();
    // A color read off a logo will rarely be one of the sixteen, so it joins
    // the board rather than being quietly rounded to the nearest.
    if (chosenColor && !colors.includes(chosenColor)) colors.push(chosenColor);
    colors.forEach(value => {
      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.dataset.grid = "palette";
      swatch.setAttribute("data-nav", "");
      swatch.setAttribute("aria-label", value);
      swatch.setAttribute("aria-pressed", String(value === chosenColor));
      swatch.style.background = value;
      swatch.addEventListener("click", () => {
        chosenColor = value;
        // Marked in place rather than re-rendered, so the swatch keeps focus
        // and the d-pad does not drop back to the start of the board.
        [...box.children].forEach(el =>
          el.setAttribute("aria-pressed", String(el.getAttribute("aria-label") === value)));
        paint();
      });
      box.appendChild(swatch);
    });
  }

  function renderFaces() {
    // The logo tab only exists while a logo has actually given up some
    // colors, and selecting it and then removing the logo has to land
    // somewhere, so it falls back to the dark board.
    const fromLogo = $("faces").querySelector("[data-face=logo]");
    fromLogo.hidden = logoColors.length === 0;
    if (tab === "logo" && !logoColors.length) tab = "dark";
    [...$("faces").children].forEach(btn =>
      btn.setAttribute("aria-pressed", String(btn.dataset.face === tab)));
  }

  function setShadow(value) {
    logoShadow = value;
    // Said in words as well as shown by the fill, since a button that is only
    // on by virtue of its color is a guess from across a room.
    $("shadow-toggle").textContent = "Logo shadow: " + (value ? "on" : "off");
    $("shadow-toggle").setAttribute("aria-pressed", String(value));
  }

  function repaintShadow(value) {
    setShadow(value);
    // The preview draws the shadow, so it has to be redrawn to show the
    // change rather than leaving the toggle as the only thing that moved.
    paint();
  }

  function setHidden(value) {
    isHidden = value;
    $("hidden-label").textContent =
      value ? "Hidden from the launcher" : "Shown on the launcher";
    $("hidden-mark").textContent = value ? "✕" : "✓";
  }

  function fillPackages(selected) {
    const sel = $("f-package");
    sel.textContent = "";
    const listed = apps.slice();
    if (selected && !listed.some(a => a.package === selected)) {
      // Keep a package that is in the catalog but not installed at the
      // moment, so editing that tile does not quietly repoint it elsewhere.
      listed.unshift({ name: selected + " (not installed)", package: selected });
    }
    listed.forEach(app => {
      const opt = document.createElement("option");
      opt.value = app.package;
      opt.textContent = app.name;
      sel.appendChild(opt);
    });
    if (selected) sel.value = selected;
  }

  function onKind() {
    const android = $("f-kind").value === "android";
    $("url-field").hidden = android;
    $("package-field").hidden = !android;
    // Fetching reads the logo off the site, and an Android app has no site.
    $("fetch").disabled = android;
  }

  function paint() {
    const face = faceColor();
    const ink = inkColor();
    const hint = $("picker-hint");
    ["preview-on", "preview-off"].forEach((id, at) => {
      const box = $(id);
      box.textContent = "";
      box.style.setProperty("--face", face);
      box.style.color = ink;
      if (!logoUrl) {
        const label = document.createElement("span");
        label.className = "pv-label";
        label.textContent = $("f-name").value || "Preview";
        box.appendChild(label);
        return;
      }
      const img = document.createElement("img");
      // The filename does not change when a logo is replaced, so the cache
      // has to be stepped around. The stamp only moves when the logo does,
      // or every keystroke in the name field would refetch the picture.
      img.src = logoUrl + "?t=" + logoStamp;
      if (!logoShadow) img.className = "flat";
      img.addEventListener("click", e => {
        const picked = pixelAt(img, e);
        if (picked) choose(picked);
        else say("Nothing there to take a color from.", true);
      });
      // Read the logo once, off whichever copy loads first.
      if (at === 0) {
        img.addEventListener("load", () => {
          if (sampledFrom === logoUrl) return;
          sampledFrom = logoUrl;
          logoColors = sampleLogo(img);
          // A new tile has no brand color yet, and the boldest color in the
          // logo is a better guess at one than anything a near-black face
          // can be turned into.
          if (!glow) {
            glow = logoColors.find(c => {
              const n = parseInt(c.slice(1), 16);
              const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
              return Math.max(r, g, b) - Math.min(r, g, b) >= 40;
            }) || "";
          }
          renderFaces();
          renderPalette();
        });
      }
      box.appendChild(img);
    });
    hint.hidden = !logoUrl;
    if (logoUrl) {
      hint.textContent = "Click either tile to take a color from the logo. "
        + "Colors found in it are on the From logo tab.";
    }
    $("shadow-toggle").hidden = !logoUrl;
  }

  function showForm(svc) {
    editing = svc && svc.id ? svc : null;
    const seed = svc || {};
    $("list-view").hidden = true;
    $("form-view").hidden = false;
    $("title").textContent = editing ? "Edit tile" : "Add a tile";
    $("f-name").value = seed.name || "";
    $("f-kind").value = seed.kind === "android" ? "android" : "";
    $("f-url").value = seed.url || "";
    $("f-note").value = seed.note || "";
    // A new tile starts on the dark board, which is what most of the
    // catalog uses and what a wall of tiles wants.
    chosenColor = (seed.tile_bg || seed.color || "").toUpperCase();
    tab = tabFor(chosenColor);
    logoUrl = seed.logo || null;
    logoStamp = Date.now();
    // Cleared per tile, or the colors read out of the last logo stay on the
    // board while a different service is being edited.
    logoColors = [];
    sampledFrom = null;
    glow = (seed.color || "").toUpperCase();
    renderPalette();
    renderFaces();
    $("remove").hidden = !editing;
    setHidden(Boolean(seed.hidden));
    setShadow(seed.logo_shadow !== false);
    fillPackages(seed.package || "");
    onKind();
    paint();
    say("");
    $("f-name").focus();
  }

  function currentId() {
    return editing ? editing.id : slug($("f-name").value);
  }

  function formService() {
    const svc = { id: currentId(), name: $("f-name").value.trim() };
    if ($("f-kind").value === "android") {
      svc.kind = "android";
      svc.package = $("f-package").value;
    } else {
      svc.url = $("f-url").value.trim();
    }
    const noteText = $("f-note").value.trim();
    if (noteText) svc.note = noteText;
    if (chosenColor) {
      svc.color = chosenColor;
      svc.tile_bg = faceColor();
      // A face is usually near-black, which has no hue to turn up, so an
      // existing brand color outranks anything derived from it. Without this
      // a tile traded its glow for grey the first time it was saved.
      svc.color = glow || glowColor();
      svc.ink = inkColor();
    }
    if (isHidden) svc.hidden = true;
    // Written only when switched off, since a shadow is the default and an
    // explicit true in every entry would be noise in the file.
    if (!logoShadow) svc.logo_shadow = false;
    return svc;
  }

  /* ---------- actions ---------- */
  function leave() { location.href = "/"; }

  $("done").addEventListener("click", leave);
  $("add").addEventListener("click", () => showForm(null));
  $("cancel").addEventListener("click", showList);
  $("f-kind").addEventListener("change", onKind);
  $("hidden-toggle").addEventListener("click", () => setHidden(!isHidden));
  $("shadow-toggle").addEventListener("click", () => repaintShadow(!logoShadow));
  $("f-name").addEventListener("input", paint);
  [...$("faces").children].forEach(btn => {
    btn.addEventListener("click", () => {
      tab = btn.dataset.face;
      renderFaces();
      // The tab decides which colors are on the board, so the board has to be
      // rebuilt. Without this the tabs highlighted and nothing else moved.
      renderPalette();
      paint();
    });
  });

  $("save").addEventListener("click", async () => {
    const svc = formService();
    if (!svc.id) { say("Give it a name first.", true); return; }
    try {
      await api("/service", svc);
      catalog = await api("/catalog");
      showList();
      say("Saved.");
    } catch (err) {
      say(err.message, true);
    }
  });

  $("remove").addEventListener("click", async () => {
    if (!editing) return;
    try {
      await api("/service/delete", { id: editing.id });
      catalog = await api("/catalog");
      showList();
      say("Deleted.");
    } catch (err) {
      say(err.message, true);
    }
  });

  $("fetch").addEventListener("click", async () => {
    const id = currentId();
    const url = $("f-url").value.trim();
    if (!id) { say("Give it a name first.", true); return; }
    if (!url) { say("Fill in the address first.", true); return; }
    say("Looking for a logo...");
    try {
      const res = await api("/logo", { id: id, url: url });
      logoUrl = res.logo;
      logoStamp = Date.now();
      sampledFrom = null;
      const guess = res.suggested || {};
      // A color already picked beats a guess, so this only fills an empty one.
      if (guess.color && !chosenColor) {
        chosenColor = guess.color.toUpperCase();
        renderPalette();
      }
      paint();
      say("Found one. Save to keep it.");
    } catch (err) {
      say(err.message, true);
    }
  });

  // Chromium can hand over any pixel on screen, which beats every other way
  // of matching a color to something already showing. Offered only where the
  // API exists, and it can still be refused at the moment of use.
  if (typeof window.EyeDropper === "function") {
    $("eyedropper").hidden = false;
    $("eyedropper").addEventListener("click", async () => {
      try {
        const result = await new window.EyeDropper().open();
        choose(result.sRGBHex.toUpperCase());
        say("Took " + result.sRGBHex.toUpperCase() + " off the screen.");
      } catch (err) {
        // Cancelling raises here too, and a cancel is not worth a warning.
        say("");
      }
    });
  }

  $("upload").addEventListener("click", () => $("file").click());

  $("file").addEventListener("change", () => {
    const file = $("file").files[0];
    const id = currentId();
    if (!file) return;
    if (!id) { say("Give it a name first.", true); return; }
    const ext = { "image/png": ".png", "image/jpeg": ".jpg",
                  "image/svg+xml": ".svg", "image/webp": ".webp" }[file.type];
    if (!ext) { say("That image type is not supported.", true); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await api("/logo", { id: id, data: reader.result, ext: ext });
        logoUrl = res.logo;
        logoStamp = Date.now();
        sampledFrom = null;
        paint();
        say("Logo set. Save to keep it.");
      } catch (err) {
        say(err.message, true);
      }
    };
    reader.readAsDataURL(file);
    $("file").value = "";
  });

  $("drop-logo").addEventListener("click", async () => {
    const id = currentId();
    if (!id) return;
    try {
      await api("/logo", { id: id, clear: true });
      logoUrl = null;
      logoColors = [];
      sampledFrom = null;
      renderFaces();
      renderPalette();
      paint();
      say("Logo removed.");
    } catch (err) {
      say(err.message, true);
    }
  });

  $("desktop").addEventListener("click", async () => {
    try {
      await api("/desktop", {});
    } catch (err) {
      // Refused when this page is open on another machine. That is the rule
      // working, so it is reported plainly rather than dressed up as a fault.
      say(err.message, true);
    }
  });

  /* ---------- start ---------- */
  (async () => {
    try {
      catalog = await api("/catalog");
    } catch (err) {
      say("Could not read the catalog: " + err.message, true);
      return;
    }
    renderList();
    $("add").focus();
    // The app list shells out to waydroid and can take a moment, so the page
    // is usable before it arrives.
    try {
      apps = await api("/android/apps");
    } catch (err) {
      apps = [];
    }
    renderAndroid();
  })();
})();
</script>
</body>
</html>
